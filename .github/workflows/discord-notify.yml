name: Discord Notification

on:
  workflow_call:
    inputs:
      project-name:
        description: Application name
        required: true
        type: string

      environment:
        description: Target environment
        required: true
        type: string

      build-result:
        description: Result of the CI build job
        required: true
        type: string

      deploy-result:
        description: Result of the CD deployment job
        required: true
        type: string

    secrets:
      DISCORD_WEBHOOK_URL:
        required: true

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest

    steps:
      - name: Determine pipeline status
        id: status
        env:
          BUILD_RESULT: ${{ inputs.build-result }}
          DEPLOY_RESULT: ${{ inputs.deploy-result }}
        shell: bash
        run: |
          if [[ "$BUILD_RESULT" == "failure" || "$DEPLOY_RESULT" == "failure" ]]; then
            echo "status=FAILURE" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD_RESULT" == "cancelled" || "$DEPLOY_RESULT" == "cancelled" ]]; then
            echo "status=CANCELLED" >> "$GITHUB_OUTPUT"
            echo "color=9807270" >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
          else
            echo "status=INCOMPLETE" >> "$GITHUB_OUTPUT"
            echo "color=9807270" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PROJECT_NAME: ${{ inputs.project-name }}
          ENVIRONMENT: ${{ inputs.environment }}
          BUILD_RESULT: ${{ inputs.build-result }}
          DEPLOY_RESULT: ${{ inputs.deploy-result }}
          PIPELINE_STATUS: ${{ steps.status.outputs.status }}
          EMBED_COLOR: ${{ steps.status.outputs.color }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_TITLE: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_WEBHOOK_URL secret is missing"
            exit 1
          fi

          payload=$(jq -n \
            --arg status "$PIPELINE_STATUS" \
            --arg project "$PROJECT_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg commit_title "$COMMIT_TITLE" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg actor "$ACTOR" \
            --arg build "$BUILD_RESULT" \
            --arg deploy "$DEPLOY_RESULT" \
            --arg url "$RUN_URL" \
            --argjson color "$EMBED_COLOR" \
            '{
              embeds: [{
                title: ("Updating " + $status + " — " + $project),
                url: $url,
                description: ("[View workflow run](" + $url + ")"),
                color: $color,
                fields: [
                  {
                    name: "Repository",
                    value: $repository,
                    inline: false
                  },
                  {
                    name: "Branch",
                    value: $branch,
                    inline: false
                  },
                  {
                    name: "Commit Title",
                    value: (if $commit_title == "" then "Not available" else $commit_title end),
                    inline: false
                  },
                  {
                    name: "Commit SHA",
                    value: $sha,
                    inline: false
                  },
                  {
                    name: "Triggered by",
                    value: $actor,
                    inline: false
                  },
                  {
                    name: "Environment",
                    value: $environment,
                    inline: false
                  },
                  {
                    name: "Build",
                    value: $build,
                    inline: true
                  },
                  {
                    name: "Deployment",
                    value: $deploy,
                    inline: true
                  }
                ],
                timestamp: (now | todate)
              }]
            }')

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"