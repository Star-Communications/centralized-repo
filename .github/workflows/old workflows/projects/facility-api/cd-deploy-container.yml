# Deploy 'Tracker-API' (container) using release zip from S3
name: cd-deploy-container

on:
  workflow_dispatch:
    inputs:
      build-release-runner:
        description: "Runner that will build the project for the release"
        type: string
        required: false
        default: "ubuntu-latest"

      deployment-runner:
        description: "Runner(s) where will deploy the release (comma separated)"
        type: string
        required: true

      linux-user:
        description: "Linux user to use for deployment"
        type: string
        required: false
        default: "devteam"

      target-version:
        description: "Version to deploy (if not of latest)"
        required: false
        default: "latest"

env:
  project-name: "facility-api"

jobs:
  run-tests:
    uses: Star-Communications/centralized-repo/.github/workflows/ci-test-dotnet.yml@main
    with:
      dotnet-version: "8.0"

  # ---------- JOB ----------
  build-release:
    uses: ./.github/workflows/ci-build-release.yml
    needs: run-tests
    with:
      build-runner: ${{ inputs.build-release-runner }}

  # ---------- JOB ----------
  deploy-container:
    uses: Star-Communications/centralized-repo/.github/workflows/cd-deploy-container.yml@main
    needs: build-release
    with:
      runs-on: ${{ inputs.deployment-runner }}
      linux-user: ${{ inputs.linux-user }}
      target-version: ${{ inputs.target-version }}
      s3-bucket: "sc-releases-bucket"
      project-name: "facility-api"
      project-bundle-name: "Facility"
    secrets:
      AWS_ROLE_TO_ASSUME: "arn:aws:iam::977628787421:role/oidc-release-upload-role"
